<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text2SQL — Natural Language to SQL</title>
  <meta name="description" content="Ask questions about your college database in plain English. Powered by a fine-tuned Qwen2.5-Coder LLM with RAG and agentic retry." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ── Animated background ── -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ── Layout ── -->
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">Text2SQL</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-label">Database Schema</h3>
        <div class="schema-tree" id="schemaTree">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-label">Query History</h3>
        <ul class="history-list" id="historyList">
          <li class="history-empty">No queries yet</li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="model-badge" id="modelBadge">
          <span class="badge-dot"></span>
          <span id="modelName">Loading model…</span>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">

      <!-- Header -->
      <header class="hero">
        <h1 class="hero-title">
          Ask your database
          <span class="gradient-text">anything</span>
        </h1>
        <p class="hero-sub">Powered by a fine-tuned Qwen2.5-Coder LLM · RAG · Agentic retry</p>
      </header>

      <!-- Query input -->
      <section class="query-box">
        <div class="input-wrapper">
          <textarea
            id="questionInput"
            class="question-input"
            placeholder="e.g. Who are the top 5 CSE students by average score?"
            rows="2"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <button class="send-btn" id="sendBtn" title="Run query (Ctrl+Enter)">
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span class="send-label">Run</span>
          </button>
        </div>
        <div class="input-hint">Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</div>

        <!-- Example queries -->
        <div class="examples">
          <span class="examples-label">Try:</span>
          <button class="example-chip" data-q="Show all students in CSE department">CSE students</button>
          <button class="example-chip" data-q="Who are the top 5 students by average score?">Top 5 students</button>
          <button class="example-chip" data-q="How many students failed in semester 2?">Fail count sem 2</button>
          <button class="example-chip" data-q="List all courses with their departments">All courses</button>
          <button class="example-chip" data-q="What is the average score per department?">Avg score by dept</button>
        </div>
      </section>

      <!-- Results area -->
      <section class="results" id="results" aria-live="polite">
        <div class="results-empty" id="emptyState">
          <div class="empty-icon">🔍</div>
          <p>Your query results will appear here</p>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
